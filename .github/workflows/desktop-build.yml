name: Desktop builds

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            runner: windows-2025
            asset_prefix: AI-Usage-Meter-64bit
          - arch: arm64
            target: aarch64-pc-windows-msvc
            runner: windows-11-vs2026-arm
            asset_prefix: AI-Usage-Meter-ARM64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: windows-${{ matrix.arch }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build installer and standalone executable
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles nsis

      - name: Stage release files
        shell: pwsh
        run: |
          $target = "${{ matrix.target }}"
          $assetPrefix = "${{ matrix.asset_prefix }}"
          $releaseDir = Join-Path "src-tauri/target" "$target/release"
          $appExe = Join-Path $releaseDir "AI-Usage-Meter.exe"
          if (!(Test-Path -LiteralPath $appExe)) {
            $appExe = Join-Path $releaseDir "ai-usage-meter.exe"
          }
          if (!(Test-Path -LiteralPath $appExe)) {
            throw "Standalone executable was not produced: $appExe"
          }

          $installerDir = Join-Path $releaseDir "bundle/nsis"
          $installer = Get-ChildItem -LiteralPath $installerDir -Filter "*-setup.exe" -File | Select-Object -First 1
          if (!$installer) {
            $installer = Get-ChildItem -LiteralPath $installerDir -Filter "*.exe" -File | Select-Object -First 1
          }
          if (!$installer) {
            throw "NSIS installer was not produced in $installerDir"
          }

          New-Item -ItemType Directory -Path "artifacts" -Force | Out-Null
          Copy-Item -LiteralPath $appExe -Destination "artifacts/$assetPrefix.exe"
          Copy-Item -LiteralPath $installer.FullName -Destination "artifacts/$assetPrefix-Setup.exe"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: artifacts/*.exe
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-apple-darwin
            runner: macos-15-intel
            asset_arch: x64
          - arch: arm64
            target: aarch64-apple-darwin
            runner: macos-15
            asset_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: macos-${{ matrix.arch }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build app and DMG
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles app,dmg

      - name: Stage release files
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          arch="${{ matrix.asset_arch }}"
          release_dir="src-tauri/target/${target}/release"
          mkdir -p artifacts
          dmg="$(find "${release_dir}/bundle/dmg" -name '*.dmg' -type f | head -n 1)"
          if [[ -z "${dmg}" ]]; then
            echo "DMG was not produced" >&2
            exit 1
          fi
          cp "${dmg}" "artifacts/AI-Usage-Meter_${arch}.dmg"
          app_dir="$(find "${release_dir}/bundle/macos" -name '*.app' -type d | head -n 1)"
          if [[ -z "${app_dir}" ]]; then
            echo "App bundle was not produced" >&2
            exit 1
          fi
          tar -C "$(dirname "${app_dir}")" -czf "artifacts/AI-Usage-Meter_${arch}.app.tar.gz" "$(basename "${app_dir}")"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            artifacts/*.dmg
            artifacts/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            asset_arch: amd64
          - arch: arm64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            asset_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: linux-${{ matrix.arch }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build deb and AppImage
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles deb,appimage

      - name: Stage release files
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          arch="${{ matrix.asset_arch }}"
          release_dir="src-tauri/target/${target}/release"
          mkdir -p artifacts
          deb="$(find "${release_dir}/bundle/deb" -name '*.deb' -type f | head -n 1)"
          appimage="$(find "${release_dir}/bundle/appimage" -name '*.AppImage' -type f | head -n 1)"
          if [[ -z "${deb}" || -z "${appimage}" ]]; then
            echo "Linux bundles missing (deb=${deb:-none}, appimage=${appimage:-none})" >&2
            find "${release_dir}/bundle" -maxdepth 3 -type f || true
            exit 1
          fi
          cp "${deb}" "artifacts/AI-Usage-Meter_${arch}.deb"
          cp "${appimage}" "artifacts/AI-Usage-Meter_${arch}.AppImage"
          chmod +x "artifacts/AI-Usage-Meter_${arch}.AppImage"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            artifacts/*.deb
            artifacts/*.AppImage
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach desktop builds to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          title="AI Usage Meter ${tag}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release edit "${tag}" --title "${title}" --notes-file .github/release-notes.zh.md --draft=false
          else
            gh release create "${tag}" --title "${title}" --notes-file .github/release-notes.zh.md --verify-tag
          fi
          mapfile -t files < <(find release-assets -type f)
          if [[ ${#files[@]} -lt 1 ]]; then
            echo "No release assets found" >&2
            exit 1
          fi
          gh release upload "${tag}" "${files[@]}" --clobber
